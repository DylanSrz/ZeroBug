name: 🐞 Bug
description: Algo no funciona como dice la HU
labels: ["bug"]
body:
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamiento esperado
      description: Cita la HU o la RN si aplica.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual
      description: Respuesta HTTP, log o captura.
      render: text
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Entorno
      placeholder: "rama dev @ abc1234 · Docker / local · Node 24"
    validations:
      required: true
  - type: input
    id: relacionada
    attributes:
      label: HU o tarea relacionada
      placeholder: "#10"
