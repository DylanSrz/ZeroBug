name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

# Si se hace push a la misma rama mientras corre, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm            # cachea ~/.npm usando package-lock.json como clave

      - run: npm ci

      - name: Lint (warnings cuentan como error)
        run: npm run lint:ci

      - name: Prettier
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Tests unitarios
        run: npm run test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zerobug
          POSTGRES_PASSWORD: zerobug
          POSTGRES_DB: zerobug_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zerobug -d zerobug_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      APP_PORT: 3000
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: zerobug
      DATABASE_PASSWORD: zerobug
      DATABASE_NAME: zerobug_test
      CORS_ORIGIN: '*'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Migraciones (valida el DataSource de la CLI)
        run: npm run migration:run

      - name: Tests e2e
        run: npm run test:e2e
